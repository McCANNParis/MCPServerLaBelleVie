# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Review PRs into dev as well as main (CodeRabbit's default is the default
# branch only). Patterns are anchored regexes.
reviews:
  # CodeRabbit posts its findings as "changes requested" and APPROVES once they
  # are resolved, the latest commit is reviewed and no pre-merge check fails.
  # .github/workflows/coderabbit-gate.yml reads that approval as the
  # "reviewed, nothing actionable open" signal for Dependabot auto-merge.
  request_changes_workflow: true
  auto_review:
    enabled: true
    base_branches:
      - "^dev$"
      - "^main$"

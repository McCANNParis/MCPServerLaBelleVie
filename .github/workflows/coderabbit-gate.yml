# CodeRabbit gate for Dependabot pull requests.
#
# dependabot-auto-merge.yml arms `gh pr merge --auto`, and auto-merge waits for
# the base branch's REQUIRED status checks. CI is one half of that. This job is
# the other half: on a Dependabot pull request it passes only when CodeRabbit
# has APPROVED the current head commit on its own. With
# `reviews.request_changes_workflow: true` in .coderabbit.yaml, CodeRabbit
# approves only once its actionable comments are resolved, the latest commit
# has been reviewed and no pre-merge check is failing — so "approved this SHA"
# is the signal for "reviewed, no open actionable findings". Resolving a thread
# fires no workflow event, but CodeRabbit's approval that follows does, and that
# re-runs this job.
#
# It is a control only once `CodeRabbit gate` is a REQUIRED status check on the
# branch the pull request targets. Until then it is advice. Rollout order:
#   1. Let it report at least once on a Dependabot pull request.
#   2. Require it on dev.
#   3. Require it on main only after the dev -> main promotion has carried
#      .coderabbit.yaml there: security updates are cut from main, CodeRabbit
#      reads its config from the head branch, and without
#      request_changes_workflow it never approves, so this job could not pass.
# Once required, a human merging a Dependabot pull request (a major, say) needs
# the same CodeRabbit approval.
#
# Why not require CodeRabbit's own commit status instead: CodeRabbit posts a
# green `CodeRabbit` status on Dependabot pull requests that it SKIPS ("Review
# skipped: bot user not eligible for review"). A green status is not a review.
#
# Overrides do not count. `@coderabbitai approve` and `@coderabbitai resolve`
# make CodeRabbit approve without a completed review, and anyone who can comment
# can post them. So any human comment addressed to CodeRabbit since the head
# commit, other than a plain review request, fails this job. To start over,
# comment `@dependabot recreate`: the new head commit needs a new approval.
#
# Non-Dependabot pull requests: the job-level `if:` skips it, and a job skipped
# by a job-level `if:` still reports a check run, which GitHub counts as
# satisfied — so requiring this check never blocks a human or routine PR. (A
# workflow skipped by an `on:` filter reports nothing and would block forever;
# that is why there is no `paths:`/`branches:` filter here.)
#
# Fails closed: no approval, an approval of an older commit, a pending "changes
# requested", an override, or an API error all fail the job, and the pull
# request stays open with auto-merge waiting.
#
# No third-party code runs here: gh and jq are preinstalled on the runner, so
# the org's Actions allow-list does not apply.
name: CodeRabbit gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # CodeRabbit approving (or requesting changes) is what flips the result, so
  # its review events must re-run the job against the same head commit.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

# A CHANGES_REQUESTED and an APPROVED review can land seconds apart on one
# commit; only the newest run's result should stand.
concurrency:
  group: coderabbit-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: CodeRabbit gate
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Everything from the event arrives via env, never interpolated into the
      # script body.
      - name: Require CodeRabbit's own approval of the head commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # The head is re-read from the API rather than taken from the event:
          # a review event can arrive after a newer push.
          head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha)
          head_date=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}" --jq .commit.committer.date)

          # CodeRabbit's verdict is its latest APPROVED / CHANGES_REQUESTED /
          # DISMISSED review. COMMENTED reviews carry findings but no verdict.
          verdict=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews?per_page=100" \
              --jq '.[] | select(.user.login == "coderabbitai[bot]")
                        | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
                        | {state, commit_id, submitted_at}' \
            | jq -s 'sort_by(.submitted_at) | last // {}')
          state=$(jq -r '.state // "NONE"' <<<"$verdict")
          commit=$(jq -r '.commit_id // ""' <<<"$verdict")

          # Human comments to CodeRabbit since the head commit, on the
          # conversation and on the diff, except a plain review request.
          overrides=$(
            { gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --jq '.[]'
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments?per_page=100" --jq '.[]'
            } | jq -rs --arg since "$head_date" '[.[]
                | select(.user.type != "Bot" and .created_at > $since)
                | select(.body | test("@coderabbitai"; "i"))
                | select(.body | test("^\\s*@coderabbitai\\s+(full\\s+)?review\\s*$"; "i") | not)
                | .user.login] | unique | join(",")')

          echo "head=${head} coderabbit_verdict=${state} verdict_commit=${commit} overrides_by=${overrides:-none}"
          if [ -n "$overrides" ]; then
            echo "::error::${overrides} addressed CodeRabbit with something other than a review request after the head commit; an override is not a review. Comment '@dependabot recreate' to start over."
            exit 1
          fi
          if [ "$state" != "APPROVED" ]; then
            echo "::error::CodeRabbit has not approved this pull request (latest verdict: ${state}). CodeRabbit skips Dependabot PRs automatically: comment '@coderabbitai review', then resolve what it raises; its approval re-runs this check."
            exit 1
          fi
          if [ "$commit" != "$head" ]; then
            echo "::error::CodeRabbit approved ${commit}, not the head ${head}."
            exit 1
          fi
          echo "::notice::CodeRabbit approved ${head}."

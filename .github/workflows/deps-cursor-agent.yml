# Weekly Cursor cloud agent: Dependabot overflow (majors, red CI, malware).
#
# Canonical repo only. Needs repo secret CURSOR_API_KEY
# (https://cursor.com/dashboard/integrations). The grocery MCP does not depend
# on @cursor/sdk — this job installs a pinned copy in a temp directory.
name: Cursor deps overflow agent

on:
  schedule:
    # Monday 07:00 UTC (09:00 Europe/Paris in summer) — after Dependabot's
    # 06:00 Europe/Paris npm/Actions run has had time to open PRs.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: deps-cursor-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  launch:
    name: Launch Cursor cloud agent
    if: github.repository == 'McCANNParis/MCPServerLaBelleVie'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CURSOR_SDK_VERSION: "1.0.28"
    steps:
      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "Set repository secret CURSOR_API_KEY (Cursor dashboard → Integrations)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pinned @cursor/sdk
        env:
          CURSOR_SDK_ROOT: ${{ runner.temp }}/cursor-sdk
        run: |
          mkdir -p "$CURSOR_SDK_ROOT"
          cd "$CURSOR_SDK_ROOT"
          npm init --yes >/dev/null
          npm install --no-fund --no-audit "@cursor/sdk@${CURSOR_SDK_VERSION}"

      - name: Launch agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_SDK_ROOT: ${{ runner.temp }}/cursor-sdk
          DEPS_PROMPT_PATH: ${{ github.workspace }}/.cursor/automations/deps-security.md
        run: node scripts/run-deps-automation.mjs
